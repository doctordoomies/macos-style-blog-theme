name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Ruby dependencies
        run: bundle install --jobs 4 --retry 3

      - name: Build Jekyll site
        run: bundle exec jekyll build --trace

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install browser-test dependency
        working-directory: tools/demo
        run: npm install

      - name: Check JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done < <(find assets/js -type f -name '*.js' -print0)

      - name: Check trailing newlines in changed text files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import subprocess

          head = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          base = os.environ.get("BASE_SHA", "").strip()

          if not base or set(base) == {"0"}:
              base = f"{head}^"

          if subprocess.run(
              ["git", "cat-file", "-e", base],
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL,
          ).returncode != 0:
              base = f"{head}^"

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "--diff-filter=ACM", base, head],
              text=True,
          ).splitlines()

          extensions = {
              ".css",
              ".html",
              ".js",
              ".json",
              ".md",
              ".rb",
              ".scss",
              ".txt",
              ".xml",
              ".yaml",
              ".yml",
          }
          filenames = {"Gemfile", ".gitignore"}
          missing = []

          for name in changed:
              path = pathlib.Path(name)
              if path.name not in filenames and path.suffix.lower() not in extensions:
                  continue
              if not path.is_file():
                  continue

              data = path.read_bytes()
              if data and not data.endswith(b"\n"):
                  missing.append(name)

          if missing:
              print("The following changed text files are missing a trailing newline:")
              for name in missing:
                  print(f"  - {name}")
              raise SystemExit(1)

          print("Trailing newline check passed.")
          PY

      - name: Smoke test default and optional-app configurations
        shell: bash
        run: |
          set -euo pipefail

          apps=(obsidian mail notes terminal games music)
          variants=(default "${apps[@]}")

          for disabled in "${variants[@]}"; do
            echo "::group::Smoke test: ${disabled}"

            if [[ "${disabled}" == "default" ]]; then
              destination="_site"
            else
              override="$(mktemp --suffix=.yml)"
              {
                echo "desktop:"
                echo "  apps:"
                for app in "${apps[@]}"; do
                  if [[ "${app}" == "${disabled}" ]]; then
                    echo "    ${app}: false"
                  else
                    echo "    ${app}: true"
                  fi
                done
              } > "${override}"

              destination="_site-smoke-${disabled}"
              bundle exec jekyll build \
                --config "_config.yml,${override}" \
                --destination "${destination}" \
                --trace
              rm -f "${override}"
            fi

            python3 -m http.server 4173 \
              --bind 127.0.0.1 \
              --directory "${destination}" \
              >"/tmp/ephemeris-${disabled}.log" 2>&1 &
            server_pid=$!

            cleanup() {
              kill "${server_pid}" 2>/dev/null || true
              wait "${server_pid}" 2>/dev/null || true
            }
            trap cleanup EXIT

            ready=0
            for _ in {1..50}; do
              if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
                ready=1
                break
              fi
              sleep 0.2
            done

            if [[ "${ready}" -ne 1 ]]; then
              cat "/tmp/ephemeris-${disabled}.log"
              exit 1
            fi

            node tools/demo/smoke.mjs \
              --base http://127.0.0.1:4173 \
              --disabled "${disabled}"

            cleanup
            trap - EXIT
            echo "::endgroup::"
          done
